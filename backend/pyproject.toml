[project]
name = "image2-gen-backend"
version = "0.1.0"
description = "FastAPI backend proxy for image2-gen"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "pillow>=10.0,<12.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
